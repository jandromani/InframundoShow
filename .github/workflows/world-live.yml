name: WORLDSTATE Live Tension Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [master]
    paths:
      - 'scripts/world-scan-v2.mjs'
      - 'scripts/news-quality-enrich.mjs'
      - 'scripts/calendar-enrich.mjs'
      - 'scripts/auto-edge-discovery.mjs'
      - 'scripts/dependency-enrich.mjs'
      - 'scripts/country-brain.mjs'
      - 'config/world-model.json'
      - 'config/political-calendar.json'
      - '.github/workflows/world-live.yml'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: worldstate-live-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openai/gpt-oss-20b' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan world tensions and autonomous graph
        run: npm run scan
      - name: Persist world memory safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'worldstate-bot'
          git config user.email 'worldstate-bot@users.noreply.github.com'
          git add data/live.json data/auto-edges.json data/dependencies.json
          if git diff --cached --quiet; then
            echo 'No state changes'
            exit 0
          fi
          git commit -m "data: autonomous world scan $(date -u +'%Y-%m-%dT%H:%MZ')"
          for attempt in 1 2 3 4 5; do
            echo "Persist attempt $attempt"
            git fetch origin master
            git rebase origin/master
            if git push origin HEAD:master; then
              echo 'World memory persisted'
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Unable to persist world memory after retries' >&2
          exit 1
