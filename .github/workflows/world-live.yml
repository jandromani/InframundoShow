name: WORLDSTATE Live Tension Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [master]
    paths:
      - 'scripts/world-scan-v2.mjs'
      - 'scripts/calendar-enrich.mjs'
      - 'config/world-model.json'
      - 'config/political-calendar.json'
      - '.github/workflows/world-live.yml'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: worldstate-live-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openai/gpt-oss-20b' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan world tensions
        run: npm run scan
      - name: Persist world memory
        shell: bash
        run: |
          git config user.name 'worldstate-bot'
          git config user.email 'worldstate-bot@users.noreply.github.com'
          git add data/live.json
          if git diff --cached --quiet; then
            echo 'No state changes'
          else
            git commit -m "data: world tension scan $(date -u +'%Y-%m-%dT%H:%MZ')"
            git fetch origin master
            git rebase origin/master
            git push origin HEAD:master
          fi
